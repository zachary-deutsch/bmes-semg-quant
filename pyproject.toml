[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bmes2025-semg"
version = "0.1.0"
description = "Synthetic verification and transparent methods for BMES2025 sEMG QUANT research"
license = "GPL-3.0-only"
license-files = ["LICENSE", "third_party/*LICENSE*"]
requires-python = ">=3.14,<3.15"
dependencies = ["numpy==2.5.4", "scipy==1.18.1", "scikit-learn==1.9.1", "torch==2.14.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
bmes-semg = "bmes_semg.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
